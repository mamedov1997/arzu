<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kart İdarəetmə</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-red: #d00000;
            --dark-gray: #343a40;
            --light-bg: #f4f7f6;
            --white: #ffffff;
            --border-color: #dee2e6;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--light-bg);
            font-family: 'Segoe UI', sans-serif;
        }

        header { padding: 25px 50px; }
        .logo img { max-height: 40px; }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 60px;
        }

        .menu-grid {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .menu-item {
            background: var(--white);
            text-decoration: none;
            width: 160px;
            padding: 20px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid transparent;
            cursor: pointer;
        }

        .menu-item i {
            font-size: 24px;
            color: var(--primary-red);
            margin-bottom: 12px;
        }

        .menu-item span {
            font-size: 14px;
            font-weight: 600;
            color: var(--dark-gray);
        }

        .menu-item:hover, .menu-item.active {
            border-color: var(--primary-red);
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        /* Axtarış Sahəsi Dizaynı */
        #search-container {
            display: none; /* İlkin olaraq gizli */
            background: var(--white);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 360px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .search-box {
            display: flex;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            transition: 0.3s;
        }

        .search-box:focus-within {
            border-color: var(--primary-red);
            box-shadow: 0 0 0 2px rgba(208, 0, 0, 0.1);
        }

        .search-box input {
            border: none;
            padding: 12px 15px;
            outline: none;
            width: 100%;
            font-size: 14px;
            color: var(--dark-gray);
        }

        .search-box button {
            background: var(--primary-red);
            color: white;
            border: none;
            padding: 0 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .search-box button:hover {
            background: #a00000;
        }

        .search-label {
            display: block;
            font-size: 13px;
            color: var(--dark-gray);
            margin-bottom: 8px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <img src="https://via.placeholder.com/120x40/ffffff/d00000?text=LOGO" alt="Logo">
        </div>
    </header>

    <div class="container">
        <div class="menu-grid">
            <div class="menu-item" onclick="toggleSearch()">
                <i class="fas fa-search-dollar"></i>
                <span>Balansı yoxla</span>
            </div>

            <div class="menu-item">
                <i class="fas fa-pen-fancy"></i>
                <span>Balansa düzəliş</span>
            </div>
        </div>

        <div id="search-container">
            <label class="search-label">Kart nömrəsini daxil edin:</label>
            <div class="search-box">
                <input type="text" placeholder="0000 0000 0000 0000">
                <button title="Axtar">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        function toggleSearch() {
            var container = document.getElementById("search-container");
            if (container.style.display === "block") {
                container.style.display = "none";
            } else {
                container.style.display = "block";
            }
        }
    </script>

</body>
</html>
