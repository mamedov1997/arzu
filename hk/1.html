<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hədiyyə Kartı Portalı</title>
    <style>
        /* Ümumi tənzimləmələr */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4; /* Açıq boz fon */
        }

        /* Header (Yuxarı hissə) */
        header {
            background-color: #ffffff;
            border-bottom: 3px solid #e63946; /* Qırmızı alt xətt */
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Sol tərəf: Logo və Menyu */
        .left-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .logo img {
            max-height: 50px;
            display: block;
        }

        .nav-menu {
            display: flex;
            gap: 20px;
        }

        .nav-menu a {
            text-decoration: none;
            color: #4a4a4a; /* Tünd olmayan boz */
            font-weight: 600;
            transition: color 0.3s;
        }

        .nav-menu a:hover {
            color: #e63946; /* Üstünə gəldikdə qırmızı */
        }

        /* Sağ tərəf: Axtarış */
        .search-container input {
            padding: 8px 15px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            width: 200px;
            transition: border-color 0.3s;
        }

        .search-container input:focus {
            border-color: #e63946;
        }

        /* Kontent sahəsi (müvəqqəti) */
        .content {
            padding: 50px 5%;
            text-align: center;
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <div class="left-section">
            <div class="logo">
                <a href="#">
                    <img src="https://via.placeholder.com/150x50?text=LOGO+BURADA" alt="Logo">
                </a>
            </div>

            <nav class="nav-menu">
                <a href="#">Hədiyyə kartları</a>
                <a href="#">Balans yoxla</a>
            </nav>
        </div>

        <div class="search-container">
            <input type="text" placeholder="Axtarış...">
        </div>
    </header>

    <main class="content">
        <h1>Xoş gəlmisiniz</h1>
        <p>Menyuların daxili məzmunu növbəti mərhələdə əlavə olunacaq.</p>
    </main>

</body>
</html>
