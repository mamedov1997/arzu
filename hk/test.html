<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Müasir Satış Paneli</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --bg: #f0f2f5;
            --card-bg: rgba(255, 255, 255, 0.9);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #2d3436;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
        }

        h2 {
            text-align: center;
            color: #4834d4;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .input-group {
            margin-bottom: 20px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }

        .input-group:hover {
            transform: translateY(-2px);
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #636e72;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--primary);
        }

        .result {
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
            color: #2d3436;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-val {
            color: #00b894;
            background: #e8f8f5;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .reset-btn {
            background: #ff7675;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        .reset-btn:hover {
            background: #d63031;
        }

        .footer-total {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px dashed #dfe6e9;
            text-align: center;
            font-size: 22px;
            font-weight: 800;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Kassa Paneli</h2>

    <div class="input-group">
        <label>Sunmi (kart)</label>
        <input type="number" id="input-kart" placeholder="Məbləğ yazın və Enter basın..." onkeypress="handleCalc(event, 'kart')">
        <div class="result">
            Yekun: <span class="total-val" id="total-kart">0.00</span> ₼
            <button class="reset-btn" onclick="resetVal('kart')">Sıfırla</button>
        </div>
    </div>

    <div class="input-group">
        <label>Sunmi (nağd)</label>
        <input type="number" id="input-nagd" placeholder="Məbləğ yazın və Enter basın..." onkeypress="handleCalc(event, 'nagd')">
        <div class="result">
            Yekun: <span class="total-val" id="total-nagd">0.00</span> ₼
            <button class="reset-btn" onclick="resetVal('nagd')">Sıfırla</button>
        </div>
    </div>

    <div class="input-group">
        <label style="color: #d63031;">Nəğd qaytarma</label>
        <input type="number" id="input-qaytar-nagd" placeholder="Məbləğ yazın və Enter basın..." onkeypress="handleCalc(event, 'qaytar-nagd')">
        <div class="result">
            Yekun: <span class="total-val" style="color: #d63031; background: #fff5f5;" id="total-qaytar-nagd">0.00</span> ₼
            <button class="reset-btn" onclick="resetVal('qaytar-nagd')">Sıfırla</button>
        </div>
    </div>

    <div class="input-group">
        <label style="color: #d63031;">Kart qaytarma</label>
        <input type="number" id="input-qaytar-kart" placeholder="Məbləğ yazın və Enter basın..." onkeypress="handleCalc(event, 'qaytar-kart')">
        <div class="result">
            Yekun: <span class="total-val" style="color: #d63031; background: #fff5f5;" id="total-qaytar-kart">0.00</span> ₼
            <button class="reset-btn" onclick="resetVal('qaytar-kart')">Sıfırla</button>
        </div>
    </div>
</div>

<script>
    // Məbləğləri saxlamaq üçün obyekt
    let totals = {
        'kart': 0,
        'nagd': 0,
        'qaytar-nagd': 0,
        'qaytar-kart': 0
    };

    function handleCalc(event, type) {
        if (event.key === "Enter") {
            let inputField = document.getElementById('input-' + type);
            let val = parseFloat(inputField.value);

            if (!isNaN(val)) {
                // Köhnə məbləğin üzərinə əlavə etmək
                totals[type] += val;
                
                // Ekranı yeniləmək
                document.getElementById('total-' + type).innerText = totals[type].toFixed(2);
                
                // Xanayı təmizləmək
                inputField.value = '';
            }
        }
    }

    function resetVal(type) {
        totals[type] = 0;
        document.getElementById('total-' + type).innerText = '0.00';
        document.getElementById('input-' + type).value = '';
    }
</script>

</body>
</html>
