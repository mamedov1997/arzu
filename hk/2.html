<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Hədiyyə Portalı</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-red: #d90429;
            --hover-red: #ef233c;
            --soft-gray: #4a4e69;
            --light-bg: #f8f9fa;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--light-bg);
        }

        /* Header Struktur */
        header {
            background: #ffffff;
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start; /* Logonun altında menyu üçün */
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* Sol tərəf tənzimləmələri */
        .brand-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .logo img {
            height: 55px;
            transition: transform 0.3s ease;
        }

        .logo img:hover {
            transform: scale(1.05);
        }

        /* Animasiyalı Menyu */
        .nav-menu {
            display: flex;
            gap: 30px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--soft-gray);
            font-weight: 500;
            font-size: 16px;
            position: relative;
            padding: 5px 0;
            transition: all 0.3s ease;
        }

        .nav-item i {
            font-size: 18px;
            color: var(--primary-red);
            transition: transform 0.3s ease;
        }

        /* Hover Animasiyası */
        .nav-item::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--primary-red);
            transition: width 0.3s ease;
        }

        .nav-item:hover {
            color: var(--primary-red);
        }

        .nav-item:hover i {
            transform: translateY(-3px);
        }

        .nav-item:hover::after {
            width: 100%;
        }

        /* Sağ tərəf: Axtarış Paneli */
        .search-box {
            position: relative;
            margin-top: 10px;
        }

        .search-box input {
            padding: 12px 20px 12px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 30px;
            outline: none;
            width: 250px;
            transition: all 0.3s ease;
            color: var(--soft-gray);
        }

        .search-box i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
        }

        .search-box input:focus {
            border-color: var(--primary-red);
            width: 300px;
            box-shadow: 0 0 10px rgba(217, 4, 41, 0.1);
        }

        /* Ana məzmun */
        .hero {
            padding: 100px 6%;
            text-align: center;
        }

        .hero h2 {
            color: var(--soft-gray);
            font-size: 32px;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <div class="logo">
                <a href="#">
                    <img src="https://via.placeholder.com/180x60/d90429/ffffff?text=LOGO+LINKI" alt="Logo">
                </a>
            </div>

            <nav class="nav-menu">
                <a href="#" class="nav-item">
                    <i class="fa-solid fa-gift"></i>
                    <span>Hədiyyə kartları</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="fa-solid fa-credit-card"></i>
                    <span>Balans yoxla</span>
                </a>
            </nav>
        </div>

        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Hər şeyi axtar...">
        </div>
    </header>

    <main class="hero">
        <h2>Sistemə xoş gəlmisiniz</h2>
        <p>Zəhmət olmasa, menyularda görmək istədiyiniz funksiyaları qeyd edin.</p>
    </main>

</body>
</html>
