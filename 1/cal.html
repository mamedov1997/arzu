<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinamik Təqvim Komponenti</title>
    <style>
        /* CSS HİSSƏSİ - Dizayn */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .calendar-container {
            width: 350px;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            padding: 20px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        .calendar-header h2 {
            font-size: 1.3rem;
            margin: 0;
            color: #2d3436;
            font-weight: 600;
        }

        .nav-btn {
            background: #f0f2f5;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            color: #636e72;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn:hover {
            background: #dfe6e9;
            color: #000;
        }

        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 700;
            color: #b2bec3;
            font-size: 0.75rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .calendar-days div {
            padding: 12px 0;
            text-align: center;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            color: #2d3436;
        }

        .calendar-days div:hover:not(.empty) {
            background-color: #e8f1ff;
            color: #007bff;
        }

        .calendar-days div.today {
            background-color: #007bff;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3);
        }

        .calendar-days div.empty {
            cursor: default;
        }
    </style>
</head>
<body>

    <div class="calendar-container">
        <div class="calendar-header">
            <button class="nav-btn" id="prevMonth">&#10094;</button>
            <h2 id="monthDisplay">Yanvar 2024</h2>
            <button class="nav-btn" id="nextMonth">&#10095;</button>
        </div>
        
        <div class="calendar-weekdays">
            <div>Be</div><div>Ça</div><div>Çə</div><div>Ca</div><div>Cu</div><div>Şə</div><div>Ba</div>
        </div>
        
        <div class="calendar-days" id="daysContainer">
            </div>
    </div>

    <script>
        const monthDisplay = document.getElementById('monthDisplay');
        const daysContainer = document.getElementById('daysContainer');
        const prevBtn = document.getElementById('prevMonth');
        const nextBtn = document.getElementById('nextMonth');

        let date = new Date();

        function renderCalendar() {
            daysContainer.innerHTML = "";
            
            const month = date.getMonth();
            const year = date.getFullYear();

            const monthNames = [
                "Yanvar", "Fevral", "Mart", "Aprel", "May", "İyun",
                "İyul", "Avqust", "Sentyabr", "Oktyabr", "Noyabr", "Dekabr"
            ];
            
            monthDisplay.innerText = `${monthNames[month]} ${year}`;

            // Ayın ilk gününün həftənin hansı gününə düşdüyünü tapırıq (0=Bazar, 1=Be...)
            const firstDayOfMonth = new Date(year, month, 1).getDay();
            // Ayın son gününü tapırıq
            const lastDayDate = new Date(year, month + 1, 0).getDate();
            
            // Azərbaycan təqviminə görə həftə Bazar ertəsindən başladığı üçün nizamlayırıq
            // (0-Bazar -> 6, 1-B.e -> 0, 2-Ç.a -> 1 və s.)
            let startPadding = firstDayOfMonth === 0 ? 6 : firstDayOfMonth - 1;

            // Ay başlamazdan əvvəlki boş xanalar
            for (let x = 0; x < startPadding; x++) {
                const emptyDiv = document.createElement("div");
                emptyDiv.classList.add("empty");
                daysContainer.appendChild(emptyDiv);
            }

            // Ayın günləri
            const today = new Date();
            for (let i = 1; i <= lastDayDate; i++) {
                const dayDiv = document.createElement("div");
                dayDiv.innerText = i;
                
                // Bu günün rənglənməsi
                if (
                    i === today.getDate() && 
                    month === today.getMonth() && 
                    year === today.getFullYear()
                ) {
                    dayDiv.classList.add("today");
                }
                
                daysContainer.appendChild(dayDiv);
            }
        }

        prevBtn.addEventListener("click", () => {
            date.setMonth(date.getMonth() - 1);
            renderCalendar();
        });

        nextBtn.addEventListener("click", () => {
            date.setMonth(date.getMonth() + 1);
            renderCalendar();
        });

        // İlkin yüklənmə
        renderCalendar();
    </script>

</body>
</html>
