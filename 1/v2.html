<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kassa Qalığ Hesablanması</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* Bütün yazı tiplərini Gilroy (əgər varsa) və ya Inter edirik */
        * {
            font-family: 'Gilroy', 'Gilroy Medium', 'Inter', -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        :root {
            --primary: #6c5ce7;
            --success: #00b894;
            --danger: #ff7675;
            --bg: #f8f9fa;
        }

        body {
            background: linear-gradient(135deg, #1e272e 0%, #485e74 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-weight: 500; /* Medium ağırlığı üçün */
        }

        .container {
            background: rgba(255, 255, 255, 0.98);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            width: 95%;
            max-width: 750px;
            position: relative;
        }

        .logo-box {
            position: absolute;
            top: 25px;
            right: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-box img {
            display: block;
            border-radius: 8px;
            max-width: 180px;
        }

        h2 {
            text-align: left;
            color: #2d3436;
            margin-bottom: 40px;
            margin-top: 10px;
            font-weight: 800; /* Başlıq daha qalın */
            padding-right: 200px;
            font-size: 28px;
            border-left: 5px solid var(--primary);
            padding-left: 15px;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .input-group {
            background: #ffffff;
            padding: 20px;
            border-radius: 18px;
            border: 1px solid #eef0f2;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            transition: 0.3s;
        }

        .input-group:hover {
            box-shadow: 0 8px 25px rgba(0,0,0,0.07);
            transform: translateY(-3px);
        }

        label {
            display: block;
            font-weight: 600; /* Gilroy Medium stili */
            margin-bottom: 15px;
            color: #4b4b4b;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #f1f2f6;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 500;
            outline: none;
            box-sizing: border-box;
            background-color: #fbfbfc;
            transition: 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.1);
        }

        .result-area {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px dashed #dfe6e9;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .total-val {
            font-weight: 700;
            font-size: 26px;
            color: var(--primary);
            text-align: center;
        }

        .btn-container {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            border: none;
            padding: 12px 5px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            transition: 0.2s;
        }

        .copy-btn { background: #6c5ce715; color: var(--primary); }
        .copy-btn:hover { background: var(--primary); color: white; }
        .copy-btn.copied { background: var(--success) !important; color: white; }

        .reset-btn { background: #ff767515; color: var(--danger); }
        .reset-btn:hover { background: var(--danger); color: white; }

        .red-text { color: var(--danger) !important; }

        @media (max-width: 600px) {
            .grid-layout { grid-template-columns: 1fr; }
            h2 { font-size: 22px; padding-right: 0; margin-top: 100px; text-align: center; border-left: none; border-bottom: 4px solid var(--primary); padding-left: 0; }
            .logo-box { width: 100%; position: absolute; top: 20px; left: 0; right: 0; }
            .logo-box img { margin: 0 auto; max-width: 120px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-box">
        <img src="https://mamedov1997.github.io/arzu/1/logo.png" alt="Logo">
    </div>

    <h2>Kassa qalığ hesablanması</h2>

    <div class="grid-layout">
        <div class="input-group">
            <label>Sunmi (kart)</label>
            <input type="number" id="input-kart" placeholder="Məbləğ + Enter" onkeypress="handleEnter(event, 'kart')">
            <div class="result-area">
                <span class="total-val" id="total-kart">0.00</span>
                <div class="btn-container">
                    <button class="copy-btn" id="btn-copy-kart" onclick="copyToClipboard('kart')">Kopyala</button>
                    <button class="reset-btn" onclick="resetVal('kart')">Sıfırla</button>
                </div>
            </div>
        </div>

        <div class="input-group">
            <label>Sunmi (nağd)</label>
            <input type="number" id="input-nagd" placeholder="Məbləğ + Enter" onkeypress="handleEnter(event, 'nagd')">
            <div class="result-area">
                <span class="total-val" id="total-nagd">0.00</span>
                <div class="btn-container">
                    <button class="copy-btn" id="btn-copy-nagd" onclick="copyToClipboard('nagd')">Kopyala</button>
                    <button class="reset-btn" onclick="resetVal('nagd')">Sıfırla</button>
                </div>
            </div>
        </div>

        <div class="input-group">
            <label class="red-text">Nəğd qaytarma</label>
            <input type="number" id="input-q-nagd" placeholder="Məbləğ + Enter" onkeypress="handleEnter(event, 'q-nagd')">
            <div class="result-area">
                <span class="total-val red-text" id="total-q-nagd">0.00</span>
                <div class="btn-container">
                    <button class="copy-btn" id="btn-copy-q-nagd" onclick="copyToClipboard('q-nagd')">Kopyala</button>
                    <button class="reset-btn" onclick="resetVal('q-nagd')">Sıfırla</button>
                </div>
            </div>
        </div>

        <div class="input-group">
            <label class="red-text">Kart qaytarma</label>
            <input type="number" id="input-q-kart" placeholder="Məbləğ + Enter" onkeypress="handleEnter(event, 'q-kart')">
            <div class="result-area">
                <span class="total-val red-text" id="total-q-kart">0.00</span>
                <div class="btn-container">
                    <button class="copy-btn" id="btn-copy-q-kart" onclick="copyToClipboard('q-kart')">Kopyala</button>
                    <button class="reset-btn" onclick="resetVal('q-kart')">Sıfırla</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let totals = { 'kart': 0, 'nagd': 0, 'q-nagd': 0, 'q-kart': 0 };

    function handleEnter(event, type) {
        if (event.key === "Enter") {
            let inputField = document.getElementById('input-' + type);
            let val = parseFloat(inputField.value);
            if (!isNaN(val)) {
                totals[type] += val;
                document.getElementById('total-' + type).innerText = totals[type].toFixed(2);
                inputField.value = '';
                
                let display = document.getElementById('total-' + type);
                display.style.transform = "scale(1.15)";
                setTimeout(() => display.style.transform = "scale(1)", 150);
            }
        }
    }

    function copyToClipboard(type) {
        const val = totals[type].toFixed(2);
        const btn = document.getElementById('btn-copy-' + type);
        navigator.clipboard.writeText(val).then(() => {
            const oldText = btn.innerText;
            btn.innerText = "Kopyalandı";
            btn.classList.add('copied');
            setTimeout(() => {
                btn.innerText = oldText;
                btn.classList.remove('copied');
            }, 1000);
        });
    }

    function resetVal(type) {
        if(confirm("Bu məlumat sıfırlansın?")) {
            totals[type] = 0;
            document.getElementById('total-' + type).innerText = '0.00';
            document.getElementById('input-' + type).value = '';
        }
    }
</script>

</body>
</html>
