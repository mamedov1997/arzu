<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kassa Qalığ Hesablanması</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --success: #00b894;
            --danger: #ff7675;
            --bg: #f8f9fa;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            width: 95%;
            max-width: 700px;
            position: relative; /* Logo üçün vacibdir */
        }

        /* Logo Stili */
        .logo-box {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #eee;
        }

        .logo-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        h2 {
            text-align: left;
            color: #2d3436;
            margin-bottom: 35px;
            font-weight: 800;
            padding-right: 100px; /* Logoya dəyməməsi üçün */
            font-size: 26px;
            border-bottom: 3px solid var(--primary);
            display: inline-block;
            padding-bottom: 5px;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .input-group {
            background: #ffffff;
            padding: 18px;
            border-radius: 18px;
            border: 1px solid #eef0f2;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            transition: 0.3s;
        }

        .input-group:hover {
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            transform: translateY(-2px);
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 12px;
            color: #4b4b4b;
            font-size: 14px;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #f1f2f6;
            border-radius: 12px;
            font-size: 18px;
            outline: none;
            box-sizing: border-box;
            background-color: #fbfbfc;
        }

        input:focus {
            border-color: var(--primary);
            background-color: #fff;
        }

        .result-area {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #dfe6e9;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .total-val {
            font-weight: 800;
            font-size: 24px;
            color: var(--primary);
            text-align: center;
        }

        .btn-container {
            display: flex;
            gap: 8px;
        }

        button {
            flex: 1;
            border: none;
            padding: 10px 5px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            transition: 0.2s;
        }

        .copy-btn { background: #eef2ff; color: var(--primary); }
        .copy-btn:hover { background: var(--primary); color: white; }
        .copy-btn.copied { background: var(--success); color: white; }

        .reset-btn { background: #fff5f5; color: var(--danger); }
        .reset-btn:hover { background: var(--danger); color: white; }

        .red-text { color: var(--danger) !important; }

        @media (max-width: 550px) {
            .grid-layout { grid-template-columns: 1fr; }
            h2 { font-size: 20px; padding-right: 0; margin-top: 60px; }
            .logo-box { width: 60px; height: 60px; top: 10px; right: 10px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-box">
        <img src="https://mamedov1997.github.io/arzu/1/logo.png" alt="Logo">
    </div>

    <h2>Kassa qalığ hesablanması</h2>

    <div class="grid-layout">
        <div class="input-group">
            <label>Sunmi (kart)</label>
            <input type="number" id="input-kart" placeholder="Məbləğ + Enter" onkeypress="handleEnter(event, 'kart')">
            <div class="result-area">
                <span class="total-val" id="total-kart">0.00</span>
                <div class="btn-container">
                    <button class="copy-btn" id="btn-copy-kart" onclick="copyToClipboard('kart')">Kopyala</button>
                    <button class="reset-btn" onclick="resetVal('kart')">Sıfırla</button>
                </div>
            </div>
        </div>

        <div class="input-group">
            <label>Sunmi (nağd)</label>
            <input type="number" id="input-nagd" placeholder="Məbləğ + Enter" onkeypress="handleEnter(event, 'nagd')">
            <div class="result-area">
                <span class="total-val" id="total-nagd">0.00</span>
                <div class="btn-container">
                    <button class="copy-btn" id="btn-copy-nagd" onclick="copyToClipboard('nagd')">Kopyala</button>
                    <button class="reset-btn" onclick="resetVal('nagd')">Sıfırla</button>
                </div>
            </div>
        </div>

        <div class="input-group">
            <label class="red-text">Nəğd qaytarma</label>
            <input type="number" id="input-q-nagd" placeholder="Məbləğ + Enter" onkeypress="handleEnter(event, 'q-nagd')">
            <div class="result-area">
                <span class="total-val red-text" id="total-q-nagd">0.00</span>
                <div class="btn-container">
                    <button class="copy-btn" id="btn-copy-q-nagd" onclick="copyToClipboard('q-nagd')">Kopyala</button>
                    <button class="reset-btn" onclick="resetVal('q-nagd')">Sıfırla</button>
                </div>
            </div>
        </div>

        <div class="input-group">
            <label class="red-text">Kart qaytarma</label>
            <input type="number" id="input-q-kart" placeholder="Məbləğ + Enter" onkeypress="handleEnter(event, 'q-kart')">
            <div class="result-area">
                <span class="total-val red-text" id="total-q-kart">0.00</span>
                <div class="btn-container">
                    <button class="copy-btn" id="btn-copy-q-kart" onclick="copyToClipboard('q-kart')">Kopyala</button>
                    <button class="reset-btn" onclick="resetVal('q-kart')">Sıfırla</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let totals = { 'kart': 0, 'nagd': 0, 'q-nagd': 0, 'q-kart': 0 };

    function handleEnter(event, type) {
        if (event.key === "Enter") {
            let inputField = document.getElementById('input-' + type);
            let val = parseFloat(inputField.value);
            if (!isNaN(val)) {
                totals[type] += val;
                document.getElementById('total-' + type).innerText = totals[type].toFixed(2);
                inputField.value = '';
                
                let display = document.getElementById('total-' + type);
                display.style.transform = "scale(1.1)";
                setTimeout(() => display.style.transform = "scale(1)", 150);
            }
        }
    }

    function copyToClipboard(type) {
        const val = totals[type].toFixed(2);
        const btn = document.getElementById('btn-copy-' + type);
        navigator.clipboard.writeText(val).then(() => {
            btn.innerText = "Kopyalandı";
            btn.classList.add('copied');
            setTimeout(() => {
                btn.innerText = "Kopyala";
                btn.classList.remove('copied');
            }, 1000);
        });
    }

    function resetVal(type) {
        if(confirm("Bu məlumat sıfırlansın?")) {
            totals[type] = 0;
            document.getElementById('total-' + type).innerText = '0.00';
            document.getElementById('input-' + type).value = '';
        }
    }
</script>

</body>
</html>
