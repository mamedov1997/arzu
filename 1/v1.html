<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kassa Qalığ Hesablanması</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            font-family: 'Gilroy', 'Gilroy Medium', 'Inter', -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            box-sizing: border-box;
        }

        :root {
            --primary: #6c5ce7;
            --success: #00b894;
            --danger: #ff7675;
            --warning: #fdcb6e;
            --bg: #1e272e;
        }

        body {
            background: linear-gradient(135deg, #1e272e 0%, #485e74 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.98);
            padding: 35px;
            border-radius: 30px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 850px;
            position: relative;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 40px;
            border-bottom: 2px solid #f1f2f6;
            padding-bottom: 20px;
        }

        .logo-box img {
            max-width: 150px;
            border-radius: 12px;
        }

        h2 {
            margin: 0;
            color: #2d3436;
            font-weight: 800;
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h2 i { color: var(--primary); }

        .main-reset-btn {
            background: var(--danger);
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            border: none;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 118, 117, 0.3);
            font-size: 13px;
            text-transform: uppercase;
        }

        .main-reset-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 118, 117, 0.4);
            background: #ff5252;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .input-group {
            background: #ffffff;
            padding: 25px;
            border-radius: 22px;
            border: 1px solid #eef0f2;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-group:hover {
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
            transform: translateY(-5px);
        }

        label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            margin-bottom: 18px;
            color: #2d3436;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        label i {
            font-size: 18px;
            color: var(--primary);
        }

        .red-label i { color: var(--danger); }

        input {
            width: 100%;
            padding: 16px;
            border: 2px solid #f1f2f6;
            border-radius: 15px;
            font-size: 20px;
            font-weight: 600;
            outline: none;
            background-color: #fbfbfc;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 5px rgba(108, 92, 231, 0.1);
        }

        .result-area {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px dashed #f1f2f6;
            text-align: center;
        }

        .total-val {
            display: block;
            font-weight: 800;
            font-size: 32px;
            color: var(--primary);
            margin-bottom: 15px;
            transition: 0.15s;
        }

        .btn-container {
            display: flex;
            gap: 8px;
        }

        .btn-container button {
            flex: 1;
            border: none;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            transition: 0.2s;
        }

        .copy-btn { background: #6c5ce715; color: var(--primary); }
        .copy-btn:hover { background: var(--primary); color: white; }
        .copy-btn.copied { background: var(--success) !important; color: white; }

        .reset-btn { background: #f1f2f6; color: #636e72; }
        .reset-btn:hover { background: #dfe6e9; color: #2d3436; }

        .red-text { color: var(--danger) !important; }

        @media (max-width: 768px) {
            .grid-layout { grid-template-columns: 1fr; }
            .header-section { flex-direction: column; align-items: center; gap: 20px; text-align: center; }
            h2 { font-size: 22px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <div class="logo-box">
            <img src="https://mamedov1997.github.io/arzu/1/logo.png" alt="Logo">
        </div>
        
        <button class="main-reset-btn" onclick="resetAll()">
            <i class="fas fa-trash-alt"></i> Hamısını Sıfırla
        </button>
    </div>

    <h2><i class="fas fa-calculator"></i> Kassa Hesablanması</h2>

    <div class="grid-layout">
        <div class="input-group">
            <label><i class="fas fa-credit-card"></i> Sunmi (kart)</label>
            <input type="number" id="input-kart" placeholder="Məbləğ + Enter" onkeypress="handleEnter(event, 'kart')">
            <div class="result-area">
                <span class="total-val" id="total-kart">0.00</span>
                <div class="btn-container">
                    <button class="copy-btn" id="btn-copy-kart" onclick="copyToClipboard('kart')"><i class="far fa-copy"></i> Kopyala</button>
                    <button class="reset-btn" onclick="resetVal('kart')">Sıfırla</button>
                </div>
            </div>
        </div>

        <div class="input-group">
            <label><i class="fas fa-money-bill-wave"></i> Sunmi (nağd)</label>
            <input type="number" id="input-nagd" placeholder="Məbləğ + Enter" onkeypress="handleEnter(event, 'nagd')">
            <div class="result-area">
                <span class="total-val" id="total-nagd">0.00</span>
                <div class="btn-container">
                    <button class="copy-btn" id="btn-copy-nagd" onclick="copyToClipboard('nagd')"><i class="far fa-copy"></i> Kopyala</button>
                    <button class="reset-btn" onclick="resetVal('nagd')">Sıfırla</button>
                </div>
            </div>
        </div>

        <div class="input-group">
            <label class="red-label"><i class="fas fa-undo"></i> Nağd Qaytarma</label>
            <input type="number" id="input-q-nagd" placeholder="Məbləğ + Enter" onkeypress="handleEnter(event, 'q-nagd')">
            <div class="result-area">
                <span class="total-val red-text" id="total-q-nagd">0.00</span>
                <div class="btn-container">
                    <button class="copy-btn" id="btn-copy-q-nagd" onclick="copyToClipboard('q-nagd')"><i class="far fa-copy"></i> Kopyala</button>
                    <button class="reset-btn" onclick="resetVal('q-nagd')">Sıfırla</button>
                </div>
            </div>
        </div>

        <div class="input-group">
            <label class="red-label"><i class="fas fa-hand-holding-usd"></i> Kart Qaytarma</label>
            <input type="number" id="input-q-kart" placeholder="Məbləğ + Enter" onkeypress="handleEnter(event, 'q-kart')">
            <div class="result-area">
                <span class="total-val red-text" id="total-q-kart">0.00</span>
                <div class="btn-container">
                    <button class="copy-btn" id="btn-copy-q-kart" onclick="copyToClipboard('q-kart')"><i class="far fa-copy"></i> Kopyala</button>
                    <button class="reset-btn" onclick="resetVal('q-kart')">Sıfırla</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let totals = { 'kart': 0, 'nagd': 0, 'q-nagd': 0, 'q-kart': 0 };

    function handleEnter(event, type) {
        if (event.key === "Enter") {
            let inputField = document.getElementById('input-' + type);
            let val = parseFloat(inputField.value);
            if (!isNaN(val)) {
                totals[type] += val;
                document.getElementById('total-' + type).innerText = totals[type].toFixed(2);
                inputField.value = '';
                
                let display = document.getElementById('total-' + type);
                display.style.transform = "scale(1.2)";
                setTimeout(() => display.style.transform = "scale(1)", 150);
            }
        }
    }

    function copyToClipboard(type) {
        const val = totals[type].toFixed(2);
        const btn = document.getElementById('btn-copy-' + type);
        navigator.clipboard.writeText(val).then(() => {
            const oldHtml = btn.innerHTML;
            btn.innerHTML = "<i class='fas fa-check'></i> Kopyalandı";
            btn.classList.add('copied');
            setTimeout(() => {
                btn.innerHTML = oldHtml;
                btn.classList.remove('copied');
            }, 1000);
        });
    }

    function resetVal(type) {
        if(confirm("Bu bölmə sıfırlansın?")) {
            totals[type] = 0;
            document.getElementById('total-' + type).innerText = '0.00';
            document.getElementById('input-' + type).value = '';
        }
    }

    function resetAll() {
        if(confirm("Bütün kassa məlumatlarını sıfırlamaq istədiyinizə əminsiniz?")) {
            for (let type in totals) {
                totals[type] = 0;
                document.getElementById('total-' + type).innerText = '0.00';
                document.getElementById('input-' + type).value = '';
            }
        }
    }
</script>

</body>
</html>
