<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kassa Qalığ Hesablanması - Canlı Versiya</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            font-family: 'Gilroy', 'Gilroy Medium', 'Inter', -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            box-sizing: border-box;
        }

        :root {
            --primary: #6c5ce7;
            --success: #00b894;
            --danger: #ff7675;
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes numberPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3) rotate(2deg); color: var(--success); }
            100% { transform: scale(1); }
        }

        body {
            background: linear-gradient(135deg, #1e272e 0%, #2f3640 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.98);
            padding: 35px;
            border-radius: 35px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 850px;
            position: relative;
            animation: fadeInUp 0.8s ease-out;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f1f2f6;
        }

        .logo-box img { 
            max-width: 140px; 
            transition: var(--transition);
        }

        .logo-box img:hover { transform: rotate(-3deg) scale(1.05); }

        .main-reset-btn {
            background: var(--danger);
            color: white;
            padding: 14px 24px;
            border-radius: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            box-shadow: 0 10px 20px rgba(255, 118, 117, 0.2);
        }

        .main-reset-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(255, 118, 117, 0.4);
            background: #ff5252;
        }

        .main-reset-btn:active { transform: scale(0.95); }

        .grid-layout { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 25px; 
        }

        .input-group {
            background: #ffffff;
            padding: 25px;
            border-radius: 25px;
            border: 1px solid #eef0f2;
            transition: var(--transition);
            position: relative;
        }

        .input-group:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
            border-color: var(--primary);
        }

        label { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            font-weight: 800; 
            margin-bottom: 15px; 
            font-size: 13px; 
            color: #4b4b4b;
            text-transform: uppercase; 
        }

        input {
            width: 100%;
            padding: 16px;
            border: 2px solid #f1f2f6;
            border-radius: 16px;
            font-size: 20px;
            font-weight: 600;
            outline: none;
            transition: all 0.3s ease;
            background: #fbfbfc;
        }

        input:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 5px rgba(108, 92, 231, 0.15);
        }

        .total-val { 
            display: block; 
            font-weight: 800; 
            font-size: 36px; 
            color: var(--primary); 
            margin: 20px 0; 
            text-align: center;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .pop-animation { animation: numberPop 0.4s ease-out; }

        .btn-container { display: flex; gap: 10px; }
        
        .btn-container button { 
            flex: 1; 
            border: none; 
            padding: 12px; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 12px; 
            font-weight: 700; 
            text-transform: uppercase;
            transition: var(--transition);
        }

        .copy-btn { background: #6c5ce715; color: var(--primary); }
        .copy-btn:hover { background: var(--primary); color: white; transform: translateY(-2px); }
        
        .reset-btn { background: #f1f2f6; color: #636e72; }
        .reset-btn:hover { background: #dfe6e9; transform: translateY(-2px); }

        /* MODAL ANIMATION */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(30, 39, 46, 0.8);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-box {
            background: white;
            padding: 40px;
            border-radius: 30px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            transform: scale(0.7);
            transition: var(--transition);
        }

        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-overlay.active .modal-box { transform: scale(1); }

        .modal-icon {
            font-size: 60px;
            color: var(--danger);
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-btns { display: flex; gap: 15px; margin-top: 25px; }
        .modal-btn {
            flex: 1; padding: 15px; border-radius: 15px; border: none; font-weight: 700; cursor: pointer; transition: var(--transition);
        }

        .btn-cancel { background: #f1f2f6; }
        .btn-confirm { background: var(--danger); color: white; }
        .btn-confirm:hover { background: #ff5252; transform: scale(1.05); }

        @media (max-width: 768px) {
            .grid-layout { grid-template-columns: 1fr; }
            .header-section { flex-direction: column; gap: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <div class="logo-box">
            <img src="https://mamedov1997.github.io/arzu/1/logo.png" alt="Logo">
        </div>
        <button class="main-reset-btn" onclick="showPopup('all')">
            <i class="fas fa-rotate"></i> Bütün Kassonu Sıfırla
        </button>
    </div>

    <h2><i class="fas fa-wallet" style="color:var(--primary); margin-right: 10px;"></i> Kassa Balansı</h2>

    <div class="grid-layout">
        <div class="input-group">
            <label><i class="fas fa-credit-card" style="color:var(--primary)"></i> Sunmi (kart)</label>
            <input type="number" id="input-kart" placeholder="Məbləğ + Enter" onkeypress="handleEnter(event, 'kart')">
            <span class="total-val" id="total-kart">0.00</span>
            <div class="btn-container">
                <button class="copy-btn" id="btn-copy-kart" onclick="copyToClipboard('kart')"><i class="far fa-copy"></i></button>
                <button class="reset-btn" onclick="showPopup('kart')">Sıfırla</button>
            </div>
        </div>

        <div class="input-group">
            <label><i class="fas fa-money-bill-wave" style="color:var(--primary)"></i> Sunmi (nağd)</label>
            <input type="number" id="input-nagd" placeholder="Məbləğ + Enter" onkeypress="handleEnter(event, 'nagd')">
            <span class="total-val" id="total-nagd">0.00</span>
            <div class="btn-container">
                <button class="copy-btn" id="btn-copy-nagd" onclick="copyToClipboard('nagd')"><i class="far fa-copy"></i></button>
                <button class="reset-btn" onclick="showPopup('nagd')">Sıfırla</button>
            </div>
        </div>

        <div class="input-group">
            <label style="color:var(--danger)"><i class="fas fa-arrow-left"></i> Nağd Qaytarma</label>
            <input type="number" id="input-q-nagd" placeholder="Məbləğ + Enter" onkeypress="handleEnter(event, 'q-nagd')">
            <span class="total-val" style="color:var(--danger)" id="total-q-nagd">0.00</span>
            <div class="btn-container">
                <button class="copy-btn" id="btn-copy-q-nagd" onclick="copyToClipboard('q-nagd')"><i class="far fa-copy"></i></button>
                <button class="reset-btn" onclick="showPopup('q-nagd')">Sıfırla</button>
            </div>
        </div>

        <div class="input-group">
            <label style="color:var(--danger)"><i class="fas fa-undo"></i> Kart Qaytarma</label>
            <input type="number" id="input-q-kart" placeholder="Məbləğ + Enter" onkeypress="handleEnter(event, 'q-kart')">
            <span class="total-val" style="color:var(--danger)" id="total-q-kart">0.00</span>
            <div class="btn-container">
                <button class="copy-btn" id="btn-copy-q-kart" onclick="copyToClipboard('q-kart')"><i class="far fa-copy"></i></button>
                <button class="reset-btn" onclick="showPopup('q-kart')">Sıfırla</button>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
        <div class="modal-icon"><i class="fas fa-triangle-exclamation"></i></div>
        <h3 style="margin:0; font-size:24px;">Diqqət!</h3>
        <p id="modalText" style="color:#636e72; margin-top:15px; line-height:1.6;">Bu məlumatlar daimi olaraq silinəcək. Davam etmək istəyirsiniz?</p>
        <div class="modal-btns">
            <button class="modal-btn btn-cancel" onclick="closePopup()">Xeyr, saxla</button>
            <button class="modal-btn btn-confirm" id="confirmAction">Bəli, sıfırla</button>
        </div>
    </div>
</div>

<script>
    let totals = { 'kart': 0, 'nagd': 0, 'q-nagd': 0, 'q-kart': 0 };
    let currentResetType = null;

    function handleEnter(event, type) {
        if (event.key === "Enter") {
            let inputField = document.getElementById('input-' + type);
            let val = parseFloat(inputField.value);
            if (!isNaN(val)) {
                totals[type] += val;
                const display = document.getElementById('total-' + type);
                display.innerText = totals[type].toFixed(2);
                
                // Canlı rəqəm animasiyası
                display.classList.remove('pop-animation');
                void display.offsetWidth; // Reflow triggers animation
                display.classList.add('pop-animation');
                
                inputField.value = '';
            }
        }
    }

    function copyToClipboard(type) {
        const val = totals[type].toFixed(2);
        const btn = document.getElementById('btn-copy-' + type);
        navigator.clipboard.writeText(val).then(() => {
            const oldHtml = btn.innerHTML;
            btn.innerHTML = "<i class='fas fa-check'></i>";
            btn.style.background = "#00b894";
            btn.style.color = "white";
            setTimeout(() => {
                btn.innerHTML = oldHtml;
                btn.style.background = "";
                btn.style.color = "";
            }, 1000);
        });
    }

    function showPopup(type) {
        currentResetType = type;
        const modal = document.getElementById('modalOverlay');
        const text = document.getElementById('modalText');
        
        text.innerText = (type === 'all') 
            ? "BÜTÜN kassa məlumatlarını sıfırlamaq istədiyinizə əminsiniz?" 
            : "Bu bölmənin balansını sıfırlamaq istəyirsiniz?";
        
        modal.classList.add('active');
    }

    function closePopup() {
        document.getElementById('modalOverlay').classList.remove('active');
    }

    document.getElementById('confirmAction').addEventListener('click', () => {
        if(currentResetType === 'all') {
            for (let t in totals) {
                totals[t] = 0;
                document.getElementById('total-' + t).innerText = '0.00';
            }
        } else {
            totals[currentResetType] = 0;
            document.getElementById('total-' + currentResetType).innerText = '0.00';
        }
        closePopup();
    });

    // Close on escape key
    document.addEventListener('keydown', (e) => {
        if(e.key === "Escape") closePopup();
    });
</script>

</body>
</html>
