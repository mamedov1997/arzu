<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A4 Çap Proqramı (v2)</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .controls {
            width: 210mm;
            padding: 15px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .controls h2 { margin-top: 0; text-align: center; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="file"] { width: 100%; padding: 8px; box-sizing: border-box; }

        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        
        button#print-button { background-color: #007bff; }
        button#print-button:hover { background-color: #0056b3; }

        /* YENİ DÜYMƏ */
        button#reset-button {
            background-color: #ffc107; /* Sarı rəng */
            color: #212529;
            display: none; /* Başlanğıcda gizli olsun */
        }
        button#reset-button:hover { background-color: #e0a800; }


        #a4-page {
            width: 210mm;
            height: 297mm;
            padding: 15mm;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .image-container {
            width: 100%;
            height: 128mm;
            border: 2px dashed #ccc;
            background-color: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .image-container img {
            max-width: 100%;
            display: block;
        }

        /* ÇAP ÜÇÜN XÜSUSİ STİLLƏR */
        @media print {
            body { background-color: white; padding: 0; margin: 0; }
            .controls { display: none; }
            #a4-page { box-shadow: none; margin: 0; padding: 15mm; width: 210mm; height: 297mm; }
            .cropper-container { border: none; }
            .cropper-view-box, .cropper-face { outline: none !important; box-shadow: none !important; }
            .cropper-line, .cropper-point { display: none !important; }
            .image-container { border: none; background: none; }
        }
        
        .preparing-for-print .image-container {
            border: none;
            background: none;
        }
    </style>
</head>
<body>

    <div class="controls">
        <h2>A4 Çap Parametrləri</h2>
        
        <div class="input-group">
            <label for="image-loader1">Şəkil 1 (Yuxarı):</label>
            <input type="file" id="image-loader1" accept="image/*">
        </div>
        
        <div class="input-group">
            <label for="image-loader2">Şəkil 2 (Aşağı):</label>
            <input type="file" id="image-loader2" accept="image/*">
        </div>
        
        <button id="print-button">ÇAP ET</button>
        <button id="reset-button">Düzəliş Et</button> </div>

    <div id="a4-page">
        <div class="image-container" id="container1">
            <img id="image1" alt="Şəkil 1 üçün yer">
        </div>
        <div class="image-container" id="container2">
            <img id="image2" alt="Şəkil 2 üçün yer">
        </div>
    </div>

    <script>
        let cropper1 = null;
        let cropper2 = null;
        
        // YENİ: Şəkillərin orijinal, kəsilməmiş versiyasını yadda saxlamaq üçün
        let originalSrc1 = null;
        let originalSrc2 = null;
        
        // Düymələri əldə etmək
        const printButton = document.getElementById('print-button');
        const resetButton = document.getElementById('reset-button');
        
        // YENİ: Cropper tənzimləmələrini ayrıca bir obyektə çıxarmaq
        const cropperOptions = {
            // aspectRatio: NaN, // SƏRBƏST KƏSMƏ ÜÇÜN BU SƏTRİ ŞƏRHƏ ALDIQ (və ya NaN qoyduq)
            viewMode: 1, // Kəsmə sahəsini şəkil ilə məhdudlaşdır
            autoCropArea: 0.8, // Başlanğıcda şəklin 80%-ni seç
            background: false,
            movable: true,
            zoomable: true,
            rotatable: true, // Döndərməni də əlavə etdim
            scalable: true,
            dragMode: 'crop' // Kəsmə çərçivəsini yenidən çəkməyə icazə verir
        };

        // Fayl yükləyicilər
        document.getElementById('image-loader1').addEventListener('change', function(e) {
            handleImageUpload(e, 'image1', 1);
        });

        document.getElementById('image-loader2').addEventListener('change', function(e) {
            handleImageUpload(e, 'image2', 2);
        });

        // Düymə hadisələri
        printButton.addEventListener('click', prepareAndPrint);
        resetButton.addEventListener('click', resetCroppers); // YENİ

        function handleImageUpload(e, imgId, cropperIndex) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const imgElement = document.getElementById(imgId);
                const imgSrc = event.target.result;
                imgElement.src = imgSrc;

                // Orijinal şəkli yadda saxla
                if (cropperIndex === 1) {
                    originalSrc1 = imgSrc;
                    if (cropper1) cropper1.destroy();
                    cropper1 = new Cropper(imgElement, cropperOptions);
                } else {
                    originalSrc2 = imgSrc;
                    if (cropper2) cropper2.destroy();
                    cropper2 = new Cropper(imgElement, cropperOptions);
                }
            };
            reader.readAsDataURL(file);
        }

        function prepareAndPrint() {
            document.body.classList.add('preparing-for-print');
        
            if (cropper1) {
                const croppedCanvas1 = cropper1.getCroppedCanvas({ imageSmoothingQuality: 'high' });
                const imgElement1 = document.getElementById('image1');
                imgElement1.src = croppedCanvas1.toDataURL('image/png');
                cropper1.destroy(); // Cropper-ı məhv et
            }
            
            if (cropper2) {
                const croppedCanvas2 = cropper2.getCroppedCanvas({ imageSmoothingQuality: 'high' });
                const imgElement2 = document.getElementById('image2');
                imgElement2.src = croppedCanvas2.toDataURL('image/png');
                cropper2.destroy(); // Cropper-ı məhv et
            }
            
            // Düymələri dəyişdir
            printButton.style.display = 'none';
            resetButton.style.display = 'block';

            setTimeout(() => {
                window.print();
            }, 100);
        }
        
        // YENİ FUNKSİYA: Cropper-ları bərpa etmək üçün
        function resetCroppers() {
            const imgElement1 = document.getElementById('image1');
            const imgElement2 = document.getElementById('image2');

            // 1-ci şəkli və cropper-ı bərpa et
            if (originalSrc1) {
                imgElement1.src = originalSrc1;
                cropper1 = new Cropper(imgElement1, cropperOptions);
            }
            
            // 2-ci şəkli və cropper-ı bərpa et
            if (originalSrc2) {
                imgElement2.src = originalSrc2;
                cropper2 = new Cropper(imgElement2, cropperOptions);
            }
            
            // Düymələri geri qaytar
            printButton.style.display = 'block';
            resetButton.style.display = 'none';
        }

        // Çap pəncərəsi bağlandıqdan sonra
        window.onafterprint = function() {
            document.body.classList.remove('preparing-for-print');
            // İstifadəçi indi "Düzəliş Et" düyməsini görəcək
            // və istəsə basa bilər.
        };

    </script>

</body>
</html>
