<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Müasir Satış Sistemi</title>
    <style>
        /* --- CSS (Dizayn və Animasiya) --- */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap');

        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --success-color: #28a745;
            --light-color: #f8f9fa;
            --dark-color: #343a40;
            --bg-color: #ffffff;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.07);
            --border-radius: 12px;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--light-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--bg-color);
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            overflow: hidden;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeIn 0.8s ease-out forwards;
        }

        /* Animasiya üçün */
        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px 30px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-weight: 600;
        }

        main {
            padding: 30px;
        }

        /* Tab-lar (Nağd / Kredit) */
        .tab-buttons {
            display: flex;
            border-bottom: 2px solid #eee;
            margin-bottom: 20px;
        }

        .tab-button {
            padding: 15px 20px;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 600;
            color: var(--secondary-color);
            position: relative;
            transition: color 0.3s ease;
        }

        .tab-button.active {
            color: var(--primary-color);
        }

        .tab-button.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--primary-color);
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from { width: 0; }
            to { width: 100%; }
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: contentFadeIn 0.5s ease;
        }

        @keyframes contentFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Form elementləri */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark-color);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box; /* Vacibdir! */
            font-size: 15px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(0,123,255,0.1);
        }

        /* Müasir düymə */
        .btn {
            background-image: linear-gradient(45deg, var(--primary-color), #0056b3);
            color: white;
            padding: 14px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(0,123,255,0.2);
        }

        /* Mesaj üçün */
        #message {
            text-align: center;
            margin-top: 20px;
            font-weight: 600;
            padding: 10px;
            border-radius: 8px;
            display: none; /* Standart olaraq gizli */
        }
        #message.success {
            background-color: rgba(40, 167, 69, 0.1);
            color: var(--success-color);
        }
        #message.error {
            background-color: rgba(220, 53, 69, 0.1);
            color: #dc3545;
        }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Satış Sistemi</h1>
        </header>
        <main>
            <div class="tab-buttons">
                <button class="tab-button active" onclick="openTab(event, 'cash')">Nağd Satış</button>
                <button class="tab-button" onclick="openTab(event, 'credit')">Kreditlə Satış</button>
            </div>

            <div id="cash" class="tab-content active">
                <form id="cash-form">
                    <div class="form-group">
                        <label for="cash-product">Məhsul</label>
                        <select id="cash-product" name="product">
                            <option value="product1">Məhsul 1</option>
                            <option value="product2">Məhsul 2</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="cash-amount">Məbləğ (AZN)</label>
                        <input type="number" id="cash-amount" name="amount" required>
                    </div>
                    <div class="form-group">
                        <label for="cash-client">Müştəri Adı</label>
                        <input type="text" id="cash-client" name="client" required>
                    </div>
                    <button type="submit" class="btn">Satışı Təsdiqlə</button>
                </form>
            </div>

            <div id="credit" class="tab-content">
                <form id="credit-form">
                    <div class="form-group">
                        <label for="credit-product">Məhsul</label>
                        <select id="credit-product" name="product">
                            <option value="product1">Məhsul 1</option>
                            <option value="product2">Məhsul 2</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="credit-total-amount">Ümumi Məbləğ (AZN)</label>
                        <input type="number" id="credit-total-amount" name="total-amount" required>
                    </div>
                    <div class="form-group">
                        <label for="credit-client">Müştəri Adı</label>
                        <input type="text" id="credit-client" name="client" required>
                    </div>
                    <div class="form-group">
                        <label for="credit-months">Kredit Müddəti (Ay)</label>
                        <select id="credit-months" name="months">
                            <option value="3">3 Ay</option>
                            <option value="6">6 Ay</option>
                            <option value="12">12 Ay</option>
                            <option value="18">18 Ay</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="credit-downpayment">İlkin Ödəniş (AZN)</label>
                        <input type="number" id="credit-downpayment" name="downpayment" value="0">
                    </div>
                    <button type="submit" class="btn">Krediti Rəsmiləşdir</button>
                </form>
            </div>

            <div id="message"></div>
        </main>
    </div>

    <script>
        // --- JavaScript (Məntiq və Google Sheets ilə əlaqə) ---

        // Tabların işləməsi üçün funksiya
        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
            tablinks = document.getElementsByClassName("tab-button");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(tabName).style.display = "block";
            evt.currentTarget.className += " active";
        }

        // Google Apps Script Web App URL-i buraya əlavə olunacaq
        // const GOOGLE_SHEET_URL = 'SİZİN_APPS_SCRIPT_URL_İNİZ'; // <-- Bunu növbəti addımda alacağıq

        const cashForm = document.getElementById('cash-form');
        const creditForm = document.getElementById('credit-form');
        const messageDiv = document.getElementById('message');

        // Nağd satış formunu dinlə
        cashForm.addEventListener('submit', function(e) {
            e.preventDefault(); // Səhifənin yenilənməsinin qarşısını al
            
            // Animasiyalı mesaj
            showMessage('Satış emal olunur...', 'processing');

            const formData = new FormData(cashForm);
            const data = Object.fromEntries(formData);
            data.saleType = 'Nağd'; // Satış növünü əlavə et
            
            console.log('Göndərilən məlumat (Nağd):', data);
            
            // ***************************************************************
            // BURADA GOOGLE APPS SCRIPT-ə GÖNDƏRMƏ KODU OLACAQ
            // fetch(GOOGLE_SHEET_URL, { method: 'POST', body: JSON.stringify(data) })
            //   .then(response => response.json())
            //   .then(result => {
            //      if(result.status === 'success') {
            //          showMessage('Nağd satış uğurla əlavə olundu!', 'success');
            //          cashForm.reset();
            //      } else {
            //          showMessage('Xəta baş verdi: ' + result.message, 'error');
            //      }
            //   })
            //   .catch(error => showMessage('Şəbəkə xətası: ' + error, 'error'));
            // ***************************************************************

            // --- Müvəqqəti (Test üçün) ---
             setTimeout(() => {
                showMessage('Nağd satış uğurla əlavə olundu! (Test)', 'success');
                cashForm.reset();
             }, 1000);
            // --- Silinəcək ---
        });

        // Kredit satış formunu dinlə
        creditForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            showMessage('Kredit rəsmiləşdirilir...', 'processing');

            const formData = new FormData(creditForm);
            const data = Object.fromEntries(formData);
            data.saleType = 'Kredit';
            
            console.log('Göndərilən məlumat (Kredit):', data);

            // ***************************************************************
            // BURADA GOOGLE APPS SCRIPT-ə GÖNDƏRMƏ KODU OLACAQ
            // ***************************************************************
            
            // --- Müvəqqəti (Test üçün) ---
             setTimeout(() => {
                showMessage('Kredit uğurla rəsmiləşdirildi! (Test)', 'success');
                creditForm.reset();
             }, 1000);
            // --- Silinəcək ---
        });


        // Mesaj göstərmə funksiyası
        function showMessage(message, type) {
            messageDiv.textContent = message;
            messageDiv.className = type; // 'success', 'error', or 'processing'
            messageDiv.style.display = 'block';

            if (type === 'success' || type === 'error') {
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 4000); // 4 saniyə sonra mesajı gizlət
            }
        }
    </script>
</body>
</html>
